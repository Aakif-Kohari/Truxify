name: Apply GNN empty-edge tensor shape fix

on:
  push:
    branches:
      - fix/gnn-empty-edge-tensor-shapes

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'fix(gnn): handle empty edge tensor shapes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fix and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path('backend/ml/gnn/models.py')
          text = models.read_text()
          old = """        return {\n            'node_features': torch.tensor(node_features, dtype=torch.float),\n            'edge_indices': torch.tensor(edge_indices, dtype=torch.long).t().contiguous(),\n            'edge_features': torch.tensor(edge_features, dtype=torch.float)\n        }"""
          new = """        if edge_indices:\n            edge_index = torch.tensor(\n                edge_indices, dtype=torch.long\n            ).t().contiguous()\n            edge_attr = torch.tensor(edge_features, dtype=torch.float)\n        else:\n            edge_index = torch.empty((2, 0), dtype=torch.long)\n            edge_attr = torch.empty((0, GNN_EDGE_FEATURE_DIM), dtype=torch.float)\n\n        return {\n            'node_features': torch.tensor(node_features, dtype=torch.float),\n            'edge_indices': edge_index,\n            'edge_features': edge_attr\n        }"""
          if old not in text:
              raise SystemExit('expected extract_features block not found')
          models.write_text(text.replace(old, new, 1))
          PY

          cat > backend/ml/tests/test_gnn_empty_edge_tensors.py <<'PY'
          import pytest
          
          torch_geometric = pytest.importorskip("torch_geometric")
          from gnn.models import GNN_EDGE_FEATURE_DIM, GraphNetworkBuilder, RouteOptimizer
          
          
          def test_zero_edge_graph_exports_valid_pyg_shapes():
              builder = GraphNetworkBuilder()
              builder.build_road_network(
                  [
                      {"id": "A", "lat": 10.0, "lng": 20.0},
                      {"id": "B", "lat": 10.1, "lng": 20.1},
                  ],
                  [],
              )
          
              data = builder.get_pytorch_data()
          
              assert data.edge_index.shape == (2, 0)
              assert data.edge_attr.shape == (0, GNN_EDGE_FEATURE_DIM)
          
          
          def test_zero_edge_graph_has_no_route_between_distinct_nodes():
              builder = GraphNetworkBuilder()
              builder.build_road_network(
                  [
                      {"id": "A", "lat": 10.0, "lng": 20.0},
                      {"id": "B", "lat": 10.1, "lng": 20.1},
                  ],
                  [],
              )
              data = builder.get_pytorch_data()
          
              assert RouteOptimizer().optimize_route("A", "B", data) is None
          PY

      - name: Run targeted tests
        working-directory: backend/ml
        run: |
          python -m pytest tests/test_gnn.py tests/test_gnn_empty_edge_tensors.py -q
          python -m compileall -q gnn tests/test_gnn.py tests/test_gnn_empty_edge_tensors.py

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/ml/gnn/models.py backend/ml/tests/test_gnn_empty_edge_tensors.py
          git rm .github/workflows/apply-gnn-empty-edge-tensor-fix.yml
          git commit -m "fix(gnn): handle empty edge tensor shapes"
          git push
